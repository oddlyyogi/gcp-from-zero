name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && vars.GCP_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/snapshelf
      IMAGE: api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - run: docker build -t "$REGISTRY/$IMAGE" .
      - run: docker push "$REGISTRY/$IMAGE"
      - run: >-
          gcloud run deploy snapshelf --image="$REGISTRY/$IMAGE"
          --region=us-central1
          --update-env-vars=APP_VERSION=${{ github.sha }}
